# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lts-openssl-mixin"
BBFILE_PATTERN_lts-openssl-mixin = "^${LAYERDIR}/"
# Use the same priority as OE-Core so that DEFAULT_PREFERENCE works
BBFILE_PRIORITY_lts-openssl-mixin = "5"

LAYERSERIES_COMPAT_lts-openssl-mixin = "wrynose"

LAYERDEPENDS_lts-openssl-mixin = " \
    core \
"

# Rust recipes in wrynose vendor openssl-sys < 0.9.114, which refuses to
# build against OpenSSL 4, see README.md (AI-generated with Claude Code)
LAYERRECOMMENDS_lts-openssl-mixin = "wrynose-rust-mixin"
